name: Build

# 動かすタイミング:
#   - push / PR のたびに test ジョブ（軽い。Windowsの分数を使わない）
#   - main への push、または v で始まるタグの push で
#     Windows 上での exe ビルドも行う
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      correction_checks:
        description: '補正全体の診断も実行（公開条件にはしない）'
        type: boolean
        default: false

jobs:
  # ------------------------------------------------------------
  # 速いテスト（tkinter・janome 不要な部分だけを Ubuntu で検証）
  # ------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: CIの停止・報告処理を確認
        run: python -m unittest -v tests_ci_runner

  # Correction mismatches are visible in a separate job and do not block builds.
  correction-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 補正モック検査（未解決の補正失敗は公開を妨げない）
        id: correction
        continue-on-error: true
        run: python tests_mock.py > correction-mock.log 2>&1
      - name: 補正検査の結果を明記
        if: always()
        shell: bash
        run: |
          echo '## 補正検査（公開条件外）' >> "$GITHUB_STEP_SUMMARY"
          echo '結果: ${{ steps.correction.outcome }}。操作・起動の公開検査とは別です。ログを参照してください。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correction-mock-report
          path: correction-mock.log
          if-no-files-found: error

  # ------------------------------------------------------------
  # Windows 上での exe ビルド
  # ------------------------------------------------------------
  build-windows:
    needs: test
    runs-on: windows-latest
    # **画面の文字集合を UTF-8 に固定する**（項目48-IL・2026-08-22）。
    # GitHub Actions の Windows は cp1252 なので、日本語を `print`
    # しただけで `UnicodeEncodeError` が出てビルドが止まった。
    # spec 側でも落ちないようにしたが（`bundle_manifest.print_report`）、
    # ここを決めておくと**記録が日本語のまま読める**。
    # `ci_smoke_test.py` の日本語の出力もここで守られる。
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージを導入
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller janome

      - name: 操作・起動・同梱物の公開検査（失敗時はビルドを止める）
        run: python -u release_checks.py

      - name: exe をビルド
        run: python -m PyInstaller correctnote.spec --noconfirm

      - name: EXEと公開ソース・同梱物を照合
        run: python verify_built_exe.py dist/CorrectNote.exe

      - name: ビルド結果をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: CorrectNote-windows
          path: dist/CorrectNote.exe
          if-no-files-found: error

  correction-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.correction_checks
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install janome
      - name: 実辞書の補正全体診断（独立ジョブ）
        run: python -u ci_smoke_test.py > correction-windows.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correction-windows-report
          path: correction-windows.log
          if-no-files-found: error

  # ------------------------------------------------------------
  # v から始まるタグを push したときだけ、GitHub Release を自動で作る
  # ------------------------------------------------------------
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: この版の変更点・未達を必ずリリースへ載せる
        env:
          RELEASE_NOTES: release_${{ github.ref_name }}.md
        run: test -s "$RELEASE_NOTES"

      - uses: actions/download-artifact@v4
        with:
          name: CorrectNote-windows
          path: dist

      - name: リリースを作成して exe を添付
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CorrectNote.exe
          body_path: release_${{ github.ref_name }}.md
          generate_release_notes: true
