<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270">
<rect width="1000" height="270" rx="14" fill="#f5f7f8"/>
<text x="34" y="42" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="19" font-weight="700" fill="#25323a">操作イメージ｜簡易入力から送った文字に背景色が付いた状態</text>
<rect x="30" y="62" width="940" height="154" rx="10" fill="#fff" stroke="#cbd5dc" stroke-width="2"/>
<text x="58" y="113" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="17" fill="#25323a">会議では、</text>
<rect x="160" y="82" width="190" height="43" rx="5" fill="#f9e5a8"/>
<text x="169" y="111" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="17" fill="#25323a">資料を確認します。</text>
<text x="360" y="113" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="17" fill="#25323a">その後、予定を整えます。</text>
<text x="58" y="177" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="17" fill="#25323a">買い物では、</text>
<rect x="160" y="146" width="171" height="43" rx="5" fill="#d8eddf"/>
<text x="169" y="175" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="17" fill="#25323a">牛乳を買います。</text>
<text x="341" y="177" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="17" fill="#25323a">帰宅後に片付けます。</text>
<text x="34" y="247" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="14" fill="#596b74">背景色が付いた範囲は、簡易入力から本文へ送った文字です。</text>
</svg>