</g><g font-family="Yu Gothic UI, Meiryo, sans-serif">
<text x="52" y="244" font-size="15" fill="#ffffff">英字</text><text x="150" y="244" font-size="15" fill="#bdbdbd">文字</text><text x="216" y="244" font-size="13" fill="#ffffff">グレー（明るい）</text>
<text x="536" y="244" font-size="15" fill="#25323a">英字</text><text x="634" y="244" font-size="15" fill="#525252">文字</text><text x="700" y="244" font-size="13" fill="#25323a">グレー（やや濃い）</text>
