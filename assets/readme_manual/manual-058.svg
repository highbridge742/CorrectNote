<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340">
<rect width="960" height="340" rx="14" fill="#f5f7f8"/>
<text x="34" y="42" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#25323a">品詞ごとのサイズ倍率｜初期値</text>
<text x="36" y="82" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="14" fill="#596b74">本文・補正欄の基準サイズに倍率を掛け、小数点以下は切り上げます。</text>
<g font-family="Yu Gothic UI, Meiryo, sans-serif" fill="#25323a">
<rect x="34" y="104" width="892" height="54" rx="8" fill="#e7f1f4"/><text x="54" y="138" font-size="17">名詞・動詞・形容詞・副詞・助動詞</text><text x="860" y="138" text-anchor="end" font-size="19" font-weight="700" fill="#176b82">1.1倍</text>
<rect x="34" y="170" width="892" height="54" rx="8" fill="#fff" stroke="#cbd5dc"/><text x="54" y="204" font-size="17">数詞</text><text x="860" y="204" text-anchor="end" font-size="19" font-weight="700" fill="#176b82">1.2倍</text>
<rect x="34" y="236" width="892" height="54" rx="8" fill="#fff" stroke="#cbd5dc"/><text x="54" y="270" font-size="17">名詞（サ変）・その他の品詞</text><text x="860" y="270" text-anchor="end" font-size="19" font-weight="700" fill="#596b74">1.0倍</text>
</g></svg>